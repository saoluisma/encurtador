<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Acesso...</title>
    <style>
        body { background-color: #0b1220; color: #22c55e; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid rgba(34, 197, 94, 0.1); border-top: 4px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Verificando segurança...</p>

    <script>
        // 1. CONFIGURAÇÕES
        const FIREBASE_URL = "https://dadosdeqr-default-rtdb.firebaseio.com/acessos_qr.json";
        const URL_DESTINO = "https://saoluisma.github.io/Bloquear-cassinos/";

        async function capturarLocalizacao() {
            const apis = [
                'https://ipapi.co/json/',
                'https://ipwho.is/',
                'https://api.db-ip.com/v2/free/self'
            ];

            for (let url of apis) {
                try {
                    const res = await fetch(url);
                    const d = await res.json();
                    return {
                        ip: d.ip || d.query || "Privado",
                        cidade: d.city || d.city_name || "Desconhecida",
                        regiao: d.region || d.region_name || "Desconhecida",
                        pais: d.country || d.country_name || "Brasil",
                        provedor: d.org || d.connection?.isp || "Desconhecido",
                        mapa: d.latitude ? `https://www.google.com/maps?q=${d.latitude},${d.longitude}` : "N/A"
                    };
                } catch (e) { continue; }
            }
            return { info: "Localização Bloqueada pelo Navegador" };
        }

        async function iniciarRastreio() {
            // A. Captura dados do dispositivo
            const dadosDispositivo = {
                data_hora: new Date().toLocaleString("pt-BR"),
                dispositivo: navigator.userAgent.toLocaleLowerCase().includes('mobile') ? 'Celular' : 'Computador',
                navegador: navigator.userAgent,
                idioma: navigator.language,
                tela: `${window.screen.width}x${window.screen.height}`,
                referencia: document.referrer || "QR Code Direto"
            };

            // B. Captura localização (IP)
            const dadosLocalizacao = await capturarLocalizacao();

            // C. Junta tudo
            const payload = { ...dadosDispositivo, ...dadosLocalizacao };

            // D. ENVIA PARA O FIREBASE VIA POST (REST API)
            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' }
                });
                console.log("Dados salvos com sucesso!");
            } catch (err) {
                console.error("Erro ao salvar:", err);
            } finally {
                // E. REDIRECIONA SEMPRE
                window.location.href = URL_DESTINO;
            }
        }

        // Executa ao abrir
        iniciarRastreio();

        // Backup de segurança (Redireciona em 5s caso o fetch trave)
        setTimeout(() => { window.location.href = URL_DESTINO; }, 5000);
    </script>
</body>
</html>
